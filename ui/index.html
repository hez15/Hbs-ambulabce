<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBS Ambulance HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     MEDICAL HUD — bottom-left corner
═══════════════════════════════════════════════════════ -->
<div id="medical-hud" class="hidden">

    <!-- Body diagram — SVG human silhouette -->
    <div id="body-diagram">
        <svg id="body-svg" viewBox="0 0 90 190" xmlns="http://www.w3.org/2000/svg">
            <!-- Head: circle -->
            <circle id="bp-head" data-part="head" cx="45" cy="16" r="14"/>
            <!-- Neck connector (visual only) -->
            <rect class="body-connector" x="39" y="29" width="12" height="11" rx="3"/>
            <!-- Torso: wide at shoulders, tapers toward waist -->
            <path id="bp-torso" data-part="torso"
                d="M19,40 L71,40 L65,92 L25,92 Z"/>
            <!-- Left arm (screen-left = player left, mirror view) -->
            <rect id="bp-left_arm" data-part="left_arm"
                x="2" y="40" width="15" height="49" rx="7"/>
            <!-- Right arm -->
            <rect id="bp-right_arm" data-part="right_arm"
                x="73" y="40" width="15" height="49" rx="7"/>
            <!-- Left leg — splays slightly outward -->
            <path id="bp-left_leg" data-part="left_leg"
                d="M25,94 L45,94 L41,177 Q41,183 36,183 L22,183 Q17,183 17,177 Z"/>
            <!-- Right leg -->
            <path id="bp-right_leg" data-part="right_leg"
                d="M65,94 L45,94 L49,177 Q49,183 54,183 L68,183 Q73,183 73,177 Z"/>
        </svg>
    </div>

    <!-- Stress bar -->
    <div class="hud-row">
        <span class="hud-label">STRESS</span>
        <div class="bar-bg">
            <div id="stress-fill" class="bar-fill stress-fill"></div>
        </div>
        <span id="stress-val" class="hud-val">0</span>
    </div>

    <!-- Addiction indicator (shown when any substance > 0) -->
    <div id="addiction-row" class="hud-row hidden">
        <span class="hud-label">DEPEND.</span>
        <div class="bar-bg">
            <div id="addiction-fill" class="bar-fill addiction-fill"></div>
        </div>
        <span id="addiction-val" class="hud-val">0</span>
    </div>

    <!-- Status icons -->
    <div id="status-icons">
        <span id="icon-bloodloss" class="icon hidden" title="Bloodloss">🩸</span>
        <span id="icon-pain"      class="icon hidden" title="Pain Suppressed">💊</span>
        <span id="icon-withdraw"  class="icon hidden" title="Withdrawal">🥵</span>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     DEATH SCREEN — full overlay
═══════════════════════════════════════════════════════ -->
<div id="death-screen" class="hidden">
    <div id="death-box">
        <h1 id="death-title">YOU ARE DOWN</h1>
        <p  id="death-sub">Waiting for EMS...</p>

        <!-- Timer -->
        <div id="timer-block">
            <span id="timer-label">Bleedout in</span>
            <span id="timer-value">5:00</span>
        </div>

        <!-- Last words -->
        <div id="will-block">
            <textarea id="will-input" maxlength="280"
                placeholder="Leave your last words..."></textarea>
        </div>

        <!-- Respawn button -->
        <div id="btn-block">
            <button class="death-btn" id="btn-respawn" onclick="onRespawn()">
                Respawn at Hospital
            </button>
        </div>

        <!-- Force respawn (when timer expires) -->
        <div id="force-block" class="hidden">
            <p>You have died.</p>
            <button class="death-btn danger" onclick="onRespawn()">
                Confirm Respawn
            </button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
