<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HBS Medical</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Medical HUD — top-left corner -->
<div id="medical-hud" class="hidden">
    <div id="body-diagram">
        <svg id="body-svg" viewBox="0 0 90 190" xmlns="http://www.w3.org/2000/svg">
            <circle id="bp-head"      data-part="head"      cx="45" cy="16" r="14"/>
            <rect   class="body-connector" x="39" y="29" width="12" height="11" rx="3"/>
            <path   id="bp-torso"     data-part="torso"     d="M19,40 L71,40 L65,92 L25,92 Z"/>
            <rect   id="bp-left_arm"  data-part="left_arm"  x="2"  y="40" width="15" height="49" rx="7"/>
            <rect   id="bp-right_arm" data-part="right_arm" x="73" y="40" width="15" height="49" rx="7"/>
            <path   id="bp-left_leg"  data-part="left_leg"  d="M25,94 L45,94 L41,177 Q41,183 36,183 L22,183 Q17,183 17,177 Z"/>
            <path   id="bp-right_leg" data-part="right_leg" d="M65,94 L45,94 L49,177 Q49,183 54,183 L68,183 Q73,183 73,177 Z"/>
        </svg>
    </div>

    <div class="hud-row">
        <span class="hud-label">HEALTH</span>
        <div class="bar-bg"><div id="health-fill" class="bar-fill health-fill"></div></div>
        <span id="health-val" class="hud-val">100</span>
    </div>

    <div class="hud-row">
        <span class="hud-label">STRESS</span>
        <div class="bar-bg"><div id="stress-fill" class="bar-fill stress-fill"></div></div>
        <span id="stress-val" class="hud-val">0</span>
    </div>

    <div id="addiction-row" class="hud-row hidden">
        <span class="hud-label">DEPEND.</span>
        <div class="bar-bg"><div id="addiction-fill" class="bar-fill addiction-fill"></div></div>
        <span id="addiction-val" class="hud-val">0</span>
    </div>

    <div id="status-icons">
        <span id="icon-bloodloss" class="icon hidden" title="Bloodloss">🩸</span>
        <span id="icon-pain"      class="icon hidden" title="Pain Suppressed">💊</span>
        <span id="icon-withdrawal" class="icon hidden" title="Withdrawal">🥵</span>
    </div>
</div>

<!-- Medical Minigame -->
<div id="minigame" class="hidden">
    <div id="mg-header">
        <span id="mg-icon"></span>
        <span id="mg-label">Treating Wounds</span>
    </div>
    <div id="mg-track-wrap">
        <div id="mg-track">
            <div id="mg-zone"></div>
            <div id="mg-cursor"></div>
        </div>
    </div>
    <div id="mg-footer">
        <span id="mg-hint">Press <kbd>E</kbd> when the marker is inside the zone</span>
        <span id="mg-rounds">Round <span id="mg-round-cur">1</span> / <span id="mg-round-max">2</span></span>
    </div>
</div>

<!-- Death Screen -->
<div id="death-screen" class="hidden">
    <div id="death-box">
        <h1 id="death-title">YOU ARE DOWN</h1>
        <p  id="death-sub">Waiting for EMS...</p>
        <div id="timer-block">
            <span id="timer-label">Bleedout in</span>
            <span id="timer-value">5:00</span>
        </div>
        <div id="will-block">
            <textarea id="will-input" maxlength="280" placeholder="Leave your last words..."></textarea>
        </div>
        <div id="btn-block">
            <button class="death-btn" id="btn-respawn" onclick="onRespawn()">Respawn at Hospital</button>
        </div>
        <div id="force-block" class="hidden">
            <p>You have died.</p>
            <button class="death-btn danger" onclick="onRespawn()">Confirm Respawn</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
